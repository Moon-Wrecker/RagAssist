# ==============================================================================
# RagAssist Model Catalog & Role Configuration
# ==============================================================================
# Single source of truth for LLM providers, model capabilities, pricing, and role assignments.
# Synchronized with src/ragassist/shared/config/settings.py and AGENTS.md § 2.

version: "1.0"

providers:
  openai:
    adapter: openai
    api_key_env: OPENAI_API_KEY
    timeout_seconds: 30.0

  anthropic:
    adapter: anthropic
    api_key_env: ANTHROPIC_API_KEY
    timeout_seconds: 30.0

  openrouter:
    adapter: openrouter
    api_key_env: OPENROUTER_API_KEY
    base_url: "https://openrouter.ai/api/v1"
    default_headers:
      HTTP-Referer: "https://github.com/ragassist/ragassist"
      X-Title: "RagAssist"
    timeout_seconds: 45.0

  # Google Gemini via its OpenAI-compatible endpoint (GEMINI_BASE_URL). Optional: with GEMINI_API_KEY empty its models
  # are skipped wherever they are listed as a fallback (see docs/adr/0013-gemini-provider.md).
  gemini:
    adapter: gemini
    api_key_env: GEMINI_API_KEY
    base_url_env: GEMINI_BASE_URL
    timeout_seconds: 60.0
    skip_when_unconfigured: true

  openai_compatible:
    adapter: openai_compatible
    api_key_env: OPENAI_COMPATIBLE_API_KEY
    base_url_env: OPENAI_COMPATIBLE_BASE_URL
    timeout_seconds: 60.0

models:
  # --- OpenAI Models ---
  gpt-4o:
    provider: openai
    model_name: "gpt-4o"
    context_window: 128000
    max_output_tokens: 4096
    pricing:
      input_cost_per_mtok: 2.50
      output_cost_per_mtok: 10.00
    capabilities:
      tool_calling: true
      json_mode: true
      vision: true
      logprobs: true
      streaming: true
    default_params:
      temperature: 0.1

  gpt-4o-mini:
    provider: openai
    model_name: "gpt-4o-mini"
    context_window: 128000
    max_output_tokens: 16384
    pricing:
      input_cost_per_mtok: 0.15
      output_cost_per_mtok: 0.60
    capabilities:
      tool_calling: true
      json_mode: true
      vision: true
      logprobs: true
      streaming: true
    default_params:
      temperature: 0.0

  # --- Anthropic Models ---
  claude-3-5-sonnet:
    provider: anthropic
    model_name: "claude-3-5-sonnet-20241022"
    context_window: 200000
    max_output_tokens: 8192
    pricing:
      input_cost_per_mtok: 3.00
      output_cost_per_mtok: 15.00
    capabilities:
      tool_calling: true
      json_mode: true
      vision: true
      logprobs: false
      streaming: true
    default_params:
      temperature: 0.1

  claude-3-5-haiku:
    provider: anthropic
    model_name: "claude-3-5-haiku-20241022"
    context_window: 200000
    max_output_tokens: 8192
    pricing:
      input_cost_per_mtok: 0.80
      output_cost_per_mtok: 4.00
    capabilities:
      tool_calling: true
      json_mode: true
      vision: false
      logprobs: false
      streaming: true
    default_params:
      temperature: 0.0

  # Verified live 2026-11-10 with the project key: GET /v1/models/<id> reports max_input_tokens 1,000,000 and
  # max_tokens 128,000 for both, and a one-token call returns 200. Pricing is from
  # https://platform.claude.com/docs/en/about-claude/pricing (read 2026-11-10): Haiku 5.5 is $0.10/$0.50 per MTok for
  # prompts up to 100k tokens ($0.50/$2.50 above that; the lower tier is used because our prompts are short), Sonnet 5.5
  # is $2/$10. The Claude 3.5 entries below are retired: the same
  # key gets 404 for claude-3-5-sonnet-20241022 and claude-3-5-haiku-20241022; they stay only so old configs resolve.
  claude-haiku-5-5:
    provider: anthropic
    model_name: "claude-haiku-5-5"
    context_window: 1000000
    max_output_tokens: 128000
    pricing:
      input_cost_per_mtok: 0.10
      output_cost_per_mtok: 0.50
    pricing:
      input_cost_per_mtok: 0.10
      output_cost_per_mtok: 0.50
    capabilities:
      tool_calling: true
      json_mode: true
      vision: true
      logprobs: false
      streaming: true
    default_params:
      temperature: 0.0

  claude-sonnet-5-5:
    provider: anthropic
    model_name: "claude-sonnet-5-5"
    context_window: 1000000
    max_output_tokens: 128000
    pricing:
      input_cost_per_mtok: 2.00
      output_cost_per_mtok: 10.00
    capabilities:
      tool_calling: true
      json_mode: true
      vision: true
      logprobs: false
      streaming: true
    default_params:
      temperature: 0.1

  claude-3-haiku:
    provider: anthropic
    model_name: "claude-3-haiku-20240307"
    context_window: 200000
    max_output_tokens: 4096
    pricing:
      input_cost_per_mtok: 0.25
      output_cost_per_mtok: 1.25
    capabilities:
      tool_calling: true
      json_mode: true
      vision: false
      logprobs: false
      streaming: true
    default_params:
      temperature: 0.0

  # --- OpenRouter Routed Models ---
  openrouter-llama-3.1-70b:
    provider: openrouter
    model_name: "meta-llama/llama-3.1-70b-instruct"
    context_window: 131072
    max_output_tokens: 4096
    pricing:
      input_cost_per_mtok: 0.40
      output_cost_per_mtok: 0.40
    capabilities:
      tool_calling: true
      json_mode: false
      vision: false
      logprobs: false
      streaming: true
    default_params:
      temperature: 0.1

  openrouter-mistral-large:
    provider: openrouter
    model_name: "mistralai/mistral-large-2407"
    context_window: 128000
    max_output_tokens: 4096
    pricing:
      input_cost_per_mtok: 2.00
      output_cost_per_mtok: 6.00
    capabilities:
      tool_calling: true
      json_mode: false
      vision: false
      logprobs: false
      streaming: true
    default_params:
      temperature: 0.1

  # --- Google Gemini (OpenAI-compatible endpoint) ---
  # Limits and prices verified 2026-11-10 against https://ai.google.dev/gemini-api/docs/models (per-model pages) and
  # https://ai.google.dev/gemini-api/docs/pricing (Standard tier, USD per 1M tokens, thinking tokens billed as output).
  # The "-latest" aliases are moving pointers (Google: "hot-swapped with every new release", 2-week email notice), so
  # their limits and prices below are those of the model each currently resolves to, copied from the pinned model.
  # Scheduled price change (docs): gemini-3.8-flash goes to 1.50 / 7.50 on 2027-01-01.
  # UNVERIFIED: the docs do not list which model gemini-flash-latest / gemini-flash-lite-latest currently resolve to;
  # gemini-pro-latest answered as gemini-3.1-pro in a live quota error. logprobs: not documented, so false.
  gemini-flash-latest:
    provider: gemini
    model_name: "gemini-flash-latest"
    context_window: 1048576   # gemini-3.8-flash: input limit 1,048,576
    max_output_tokens: 65536  # gemini-3.8-flash: output limit 65,536
    pricing:
      input_cost_per_mtok: 0.75
      output_cost_per_mtok: 3.75
    capabilities:
      tool_calling: true
      json_mode: true
      vision: true
      logprobs: false
      streaming: true
    default_params:
      temperature: 0.1

  gemini-flash-lite-latest:
    provider: gemini
    model_name: "gemini-flash-lite-latest"
    context_window: 1048576   # gemini-3.5-flash-lite
    max_output_tokens: 65536
    pricing:
      input_cost_per_mtok: 0.30
      output_cost_per_mtok: 2.50
    capabilities:
      tool_calling: true
      json_mode: true
      vision: true
      logprobs: false
      streaming: true
    default_params:
      temperature: 0.0

  gemini-pro-latest:
    provider: gemini
    model_name: "gemini-pro-latest"
    context_window: 1048576   # gemini-3.1-pro-preview (a preview model)
    max_output_tokens: 65536
    pricing:
      input_cost_per_mtok: 2.00   # prompts up to 200k tokens; 4.00 above
      output_cost_per_mtok: 12.00  # prompts up to 200k tokens; 18.00 above
    capabilities:
      tool_calling: true
      json_mode: true
      vision: true
      logprobs: false
      streaming: true
    default_params:
      temperature: 0.1

  # Pinned stable models, for deployments that must not follow an alias.
  gemini-3.8-flash:
    provider: gemini
    model_name: "gemini-3.8-flash"
    context_window: 1048576
    max_output_tokens: 65536
    pricing:
      input_cost_per_mtok: 0.75
      output_cost_per_mtok: 3.75
    capabilities:
      tool_calling: true
      json_mode: true
      vision: true
      logprobs: false
      streaming: true
    default_params:
      temperature: 0.1

  gemini-3.5-flash-lite:
    provider: gemini
    model_name: "gemini-3.5-flash-lite"
    context_window: 1048576
    max_output_tokens: 65536
    pricing:
      input_cost_per_mtok: 0.30
      output_cost_per_mtok: 2.50
    capabilities:
      tool_calling: true
      json_mode: true
      vision: true
      logprobs: false
      streaming: true
    default_params:
      temperature: 0.0

  # --- Local / OpenAI-Compatible (Ollama / vLLM / Groq) ---
  local-llama-3.1-8b:
    provider: openai_compatible
    model_name: "llama3.1:8b"
    context_window: 32768
    max_output_tokens: 4096
    pricing:
      input_cost_per_mtok: 0.0
      output_cost_per_mtok: 0.0
    capabilities:
      tool_calling: true
      json_mode: true
      vision: false
      logprobs: false
      streaming: true
    default_params:
      temperature: 0.0

aliases:
  gen-default: "gpt-4o"
  gen-openrouter-llama: "openrouter-llama-3.1-70b"
  fast-default: "gpt-4o-mini"
  claude-sonnet: "claude-sonnet-5-5"
  claude-haiku: "claude-haiku-5-5"
  gemini-flash: "gemini-flash-latest"
  gemini-flash-lite: "gemini-flash-lite-latest"
  gemini-pro: "gemini-pro-latest"
  gen-gemini: "gemini-flash-latest"

roles:
  generator:
    primary: "gen-default"
    fallbacks:
      - "claude-sonnet-5-5"
      - "gen-openrouter-llama"
      - "gemini-flash-latest"
    temperature: 0.1
    max_tokens: 2048

  rewriter:
    primary: "fast-default"
    fallbacks:
      - "claude-haiku-5-5"
      - "gemini-flash-lite-latest"
    temperature: 0.0
    max_tokens: 512

  agent:
    primary: "gen-default"
    fallbacks:
      - "claude-sonnet-5-5"
      - "gemini-flash-latest"
    temperature: 0.0
    max_tokens: 4096

  judge:
    primary: "fast-default"
    fallbacks:
      - "claude-haiku-5-5"
      - "gemini-flash-lite-latest"
    temperature: 0.0
    max_tokens: 1024

  decider:
    primary: "fast-default"
    fallbacks:
      - "claude-haiku-5-5"
      - "gemini-flash-lite-latest"
    temperature: 0.0
    max_tokens: 256
