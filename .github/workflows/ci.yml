name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"
      - name: Lint tests and tooling (blocking)
        run: |
          ruff check tests scripts
          ruff format --check tests
          lint-imports
      - name: Lint and type-check production code (advisory)
        # The implementation team's backlog (ruff findings and mypy errors in src/) is reported here but
        # does not block merges until it is cleared; flip continue-on-error off then.
        continue-on-error: true
        run: |
          ruff check src services evals
          ruff format --check src services evals
          mypy src

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"
      - name: Run unit tests
        run: pytest tests/unit -v --cov=src/ragassist


  integration-tests:
    # Real PostgreSQL + pgvector (RLS, UnitOfWork, pool safety). LocalStack tests start their own
    # container through Docker, which GitHub-hosted runners provide.
    runs-on: ubuntu-latest
    env:
      RAGASSIST_STRICT_PENDING: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL with a throwaway password
        # The password is generated for this run only, masked in the logs and never stored anywhere.
        run: |
          pw="$(openssl rand -hex 24)"
          echo "::add-mask::$pw"
          docker run -d --name ci-postgres -p 5432:5432 \
            -e POSTGRES_USER=ci_admin -e POSTGRES_PASSWORD="$pw" -e POSTGRES_DB=ragassist_test \
            pgvector/pgvector:pg16
          echo "TEST_DATABASE_ADMIN_URL=postgresql+asyncpg://ci_admin:${pw}@localhost:5432/ragassist_test" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            docker exec ci-postgres pg_isready -U ci_admin -d ragassist_test && exit 0
            sleep 2
          done
          docker logs ci-postgres
          exit 1
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"
      - name: Repository hygiene
        run: pytest tests/hygiene -v
      - name: Integration tests
        run: pytest tests/integration tests/security -v
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-reports
          path: reports/
          if-no-files-found: ignore

  coverage:
    # Plan section 8: the coverage ratchet and hard minimums, plus the pending and defect reports.
    runs-on: ubuntu-latest
    env:
      RAGASSIST_STRICT_PENDING: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"
      - name: Unit, graph, security, self-checks and hygiene with coverage
        run: pytest tests/unit tests/graph tests/security tests/hygiene tests/selfcheck --cov=src/ragassist --cov-branch --cov-report=json:coverage.json -q
      - name: Coverage gate (hard minimums and ratchet)
        # Advisory until the suite reaches the policy in tests/gates/coverage_policy.json (measured 2026-11-09:
        # 82.4% overall against a minimum of 85%). The policy numbers are not lowered; remove continue-on-error
        # when the gate passes.
        continue-on-error: true
        run: python tests/gates/check_coverage.py --report coverage.json
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            reports/
            coverage.json
          if-no-files-found: ignore

  frontend:
    # Web app: lint, types, generated-API drift, unit tests, build and the mocked Playwright specs (no backend).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: API types match docs/api/openapi.json
        run: npm run api:check
      - name: Unit tests
        run: npm test
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Build and mocked Playwright specs
        run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore

  flake-nightly:
    # Plan section 8: a test that fails under another random order is a flake.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"
      - name: Random-order flake check (10 seeds)
        run: bash scripts/flake_check.sh 10
