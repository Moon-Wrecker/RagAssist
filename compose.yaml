name: ragassist

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ragassist-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ragassist
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ragassist"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3.8.1
    container_name: ragassist-localstack
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,sqs,secretsmanager
      DEBUG: 0
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - localstack_data:/var/lib/localstack
      - ./infra/localstack/init.sh:/etc/localstack/init/ready.d/init.sh:ro

  mock-saas:
    build:
      context: .
      dockerfile: infra/docker/mock_saas.Dockerfile
    container_name: ragassist-mock-saas
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      PORT: 8001
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: ragassist-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_started
      mock-saas:
        condition: service_healthy

volumes:
  postgres_data:
  localstack_data:

